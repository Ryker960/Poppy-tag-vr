<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poppy Tag VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #202b38">
  <a-box position="0 1.5 -4" width="8" height="3" depth="0.2" color="#444"></a-box>
  <a-box position="0 0 -4" width="8" height="0.2" depth="8" color="#555"></a-box>
  <a-box position="0 3 -4" width="8" height="0.2" depth="8" color="#222"></a-box>

  <a-box position="-3 1 -3" color="#e52b38"></a-box>
  <a-box position="3 1 -3" color="#2676db"></a-box>

  <a-entity position="0 1.6 0">
    <a-camera></a-camera>
  </a-entity>

  <a-sky color="#182333"></a-sky>
</a-scene>
</body>
</html>
