<!DOCTYPE html>
<html>
<head>
  <title>Poppy Tag VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #252525">

  <!-- FLOOR -->
  <a-box position="0 -0.2 0"
    width="30" height="0.4" depth="30"
    color="#555555"></a-box>

  <!-- WALLS -->
  <a-box position="0 4 -10"
    width="30" height="8" depth="0.4"
    color="#174c70"></a-box>

  <a-box position="-15 4 0"
    width="0.4" height="8" depth="20"
    color="#174c70"></a-box>

  <a-box position="15 4 0"
    width="0.4" height="8" depth="20"
    color="#174c70"></a-box>

  <!-- CEILING LIGHTS -->
  <a-box position="0 7 -3"
    width="5" height="0.2" depth="1"
    color="#ffffaa"></a-box>

  <a-box position="0 7 -8"
    width="5" height="0.2" depth="1"
    color="#ffffaa"></a-box>

  <!-- FACTORY SIGN -->
  <a-box position="0 5.5 -9.7"
    width="7" height="1.5" depth="0.2"
    color="#e52b35"></a-box>

  <a-text value="PLAYTIME CO."
    position="-2.6 5.5 -9.5"
    width="6"
    color="white"></a-text>

  <!-- CONVEYOR BELT -->
  <a-box position="0 0.6 -3"
    width="10" height="1" depth="2"
    color="#222222"></a-box>

  <!-- TOY BOXES -->
  <a-box position="-3 1.3 -3"
    color="red" width="1" height="1" depth="1"></a-box>

  <a-box position="0 1.3 -3"
    color="yellow" width="1" height="1" depth="1"></a-box>

  <a-box position="3 1.3 -3"
    color="blue" width="1" height="1" depth="1"></a-box>

  <!-- BLUE FACTORY MASCOT -->
  <a-sphere position="4 2 -7"
    radius="0.8" color="#087bff"></a-sphere>

  <a-sphere position="4 3.1 -7"
    radius="0.6" color="#087bff"></a-sphere>

  <a-sphere position="3.7 3.2 -6.5"
    radius="0.12" color="white"></a-sphere>

  <a-sphere position="4.3 3.2 -6.5"
    radius="0.12" color="white"></a-sphere>
<!-- FACTORY ENTRANCE LOBBY -->

<!-- Reception desk -->
<a-box position="-6 0.6 1"
  width="4" height="1.2" depth="1.5"
  color="#263746"></a-box>

<a-box position="-6 1.25 1"
  width="4.2" height="0.15" depth="1.7"
  color="#b52b35"></a-box>

<!-- Security door -->
<a-box position="6 2.5 -5"
  width="3" height="5" depth="0.3"
  color="#252b35"></a-box>

<a-box position="6 2.5 -4.8"
  width="2.5" height="4.5" depth="0.15"
  color="#1475a8"></a-box>

<!-- Door warning -->
<a-text value="SECURITY - LOCKED"
  position="4.5 5.5 -4.5"
  width="5"
  color="red"></a-text>

<!-- Security keypad -->
<a-box position="4 1.8 -4"
  width="0.5" height="0.8" depth="0.2"
  color="#222222"></a-box>

<a-sphere position="4 2 -3.85"
  radius="0.12"
  color="red"></a-sphere>

<!-- Lobby lights -->
<a-box position="-6 6 1"
  width="4" height="0.15" depth="1"
  color="#ffffaa"></a-box>

<a-box position="6 6 1"
  width="4" height="0.15" depth="1"
  color="#ffffaa"></a-box>

<!-- Lobby sign -->
<a-text value="WELCOME TO PLAYTIME CO."
  position="-3 4 -2"
  width="7"
  color="#ffcc33"></a-text>
  <!-- PLAYER -->
  <a-entity position="0 0 5">
    <a-camera position="0 1.6 0">
      <a-cursor color="yellow"></a-cursor>
    </a-camera>
  </a-entity>

  <!-- VR CONTROLLERS -->
  <a-entity id="leftHand"<a-entity id="leftHand"
  tracked-controls="hand: left"
  hand-controls="hand: left; handModelStyle: lowPoly; color: #2196ff">
</a-entity>

<a-entity id="rightHand"
  tracked-controls="hand: right"
  hand-controls="hand: right; handModelStyle: lowPoly; color: #2196ff">
</a-entity>="hand: left" raycaster="showLine: false">
  <a-sphere radius="0.12" color="#2196ff"></a-sphere>
</a-entity>

<a-entity id="rightHand"<a-entity id="leftHand"
  tracked-controls="hand: left"
  hand-controls="hand: left; handModelStyle: lowPoly; color: #2196ff">
</a-entity>

<a-entity id="rightHand"
  tracked-controls="hand: right"
  hand-controls="hand: right; handModelStyle: lowPoly; color: #2196ff">
</a-entity>="hand: right" raycaster="showLine: false">
  <a-sphere radius="0.12" color="#2196ff"></a-sphere>
</a-entity>

</a-scene>
</body>
</html></a-scene>
</body>
</html>
